<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaizen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b6bcb'/%3E%3Cpath d='M9 22V10h3v5l5-5h4l-6 6 6 6h-4l-5-5v5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=0.6.0">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="侧栏">
    <div class="sb-top">
      <a class="brand" href="#/" data-nav="chat"><span class="logo">K</span><span>Kaizen</span></a>
      <button class="icon-btn" id="sb-collapse" type="button" title="收起侧栏" aria-label="收起侧栏"></button>
    </div>
    <button class="sb-item sb-new" id="chat-new" type="button"></button>
    <nav class="sb-nav" id="sb-nav" aria-label="功能"></nav>
    <div class="sb-label">最近对话</div>
    <div class="sb-threads" id="sb-threads"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main" id="main">
    <header class="main-top" id="main-top">
      <button class="icon-btn" id="sb-open" type="button" title="打开侧栏" aria-label="打开侧栏"></button>
      <button class="back-btn" id="back-chat" type="button" hidden>← 返回对话</button>
      <div class="main-title" id="main-title"></div>
    </header>
    <div class="demo-banner" id="demo-banner" role="status" hidden></div>
    <section class="chat" id="chat-pane" aria-label="对话">
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <div class="composer">
        <form id="chat-form" class="composer-box">
          <textarea id="chat-input" rows="1" placeholder="描述现场问题，或输入「分析 KZ-0133」"></textarea>
          <div class="composer-bar">
            <select id="chat-mode" aria-label="对话模式"><option value="rca">根因分析</option><option value="coach">改进教练</option><option value="rsi">自我进化</option></select>
            <span class="spacer"></span>
            <button class="send" id="chat-send" type="submit" aria-label="发送"></button>
          </div>
        </form>
        <div class="suggest" id="chat-suggest"></div>
        <div class="composer-note">结论需要工程师确认；关案会改写记忆，必须由你批准。</div>
      </div>
    </section>
    <section class="page" id="page-pane" hidden aria-label="页面">
      <div id="view"></div>
    </section>
  </div>
</div>
<div id="toast" role="status"></div>
<script src="app.js?v=0.6.0"></script>
</body>
</html>
